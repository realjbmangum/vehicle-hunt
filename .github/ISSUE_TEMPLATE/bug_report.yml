name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact your email address and ZIP code
        from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Email ingest (parsing alert emails)
        - Inventory API sweep
        - Scoring / grading
        - VIN decoding
        - Dashboard UI
        - Digest email
        - Setup / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your hunt.config.ts
      description: The vehicle and criteria sections. Remove your email and ZIP.
      render: typescript
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from `wrangler tail`, if relevant. Redact any keys.
      render: shell
